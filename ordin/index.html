<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세종 조례 비교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EE; --paper:#FBFAF7; --ink:#111; --sub:#5d5d5a; --line:#d6d4cc; --line2:#bdbab0;
  --acc:#152484; --acc-soft:#e3e6f4; --warn:#a4501b; --warn-soft:#f6e8dc; --ok:#2f6b3a;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono","IBM Plex Sans KR",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --paper:#1c1c1a; --ink:#eceae4; --sub:#a09e97; --line:#34332f; --line2:#4a4943;
  --acc:#8EA0F2; --acc-soft:#232842; --warn:#e3a06f; --warn-soft:#3a2a1e; --ok:#8cc596;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line2);cursor:pointer;border-radius:0}
a{color:var(--acc)}
.mono{font-family:var(--mono)}

header{border-bottom:1px solid var(--ink);padding:14px 20px 12px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
header .kick{font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--sub);margin-bottom:6px}
header h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.02em}
header h1 b{color:var(--acc);font-weight:600}
header .stat{display:flex;gap:22px;margin-left:auto}
header .stat div{font:500 11px/1.3 var(--mono);color:var(--sub)}
header .stat b{display:block;font:500 20px/1.2 var(--mono);color:var(--ink)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 20px}
.tabs button{border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--sub);font-weight:500}
.tabs button.on{border-color:var(--acc);color:var(--ink)}

main{flex:1;min-height:0;display:grid;grid-template-columns:330px minmax(0,1fr) 440px}
main>section{min-height:0;overflow:auto;border-right:1px solid var(--line)}
main>section:last-child{border-right:0}
.pad{padding:16px 20px}

/* 왼쪽 목록 */
#left{display:flex;flex-direction:column;overflow:hidden}
.search{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:8px 2px;font:16px var(--sans);color:var(--ink);outline:none}
.search input::placeholder{color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.chips button{font-size:12px;padding:2px 8px;border-color:var(--line)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sortrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--sub)}
.sortrow select{font:12px var(--sans);background:transparent;color:var(--ink);border:1px solid var(--line)}
#list{flex:1;overflow:auto}
.item{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.item:hover{background:var(--paper)}
.item.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.item .t{font-size:13.5px;line-height:1.45}
.item .m{grid-column:1;font:11px var(--mono);color:var(--sub)}
.item .n{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font:500 13px var(--mono)}
.item .n small{display:block;font-size:10px;color:var(--sub);font-weight:400}
.n.zero{color:var(--warn)}
mark{background:#ffe48a;color:#111;padding:0 1px}

/* 가운데 본문 */
.empty{color:var(--sub);padding:60px 30px;text-align:center}
.doc h2{font-size:21px;margin:0 0 4px;letter-spacing:-.01em;line-height:1.35}
.doc .meta{font:12px var(--mono);color:var(--sub);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap}
.art{border-top:1px solid var(--line);padding:10px 0}
.art .at{font-weight:600;font-size:13.5px}
.art .ac{white-space:pre-wrap;font-size:13.5px;color:var(--ink)}
.art.only{background:linear-gradient(90deg,var(--acc-soft),transparent 60%)}
.tag{display:inline-block;font:500 10.5px/1.6 var(--mono);padding:0 6px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.tag.acc{color:var(--acc)}
.tag.warn{color:var(--warn)}
.cmpbar{display:flex;gap:8px;align-items:center;margin:0 0 12px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);font-size:12.5px}
.cmpbar button{padding:1px 8px;font-size:12px;margin-left:auto}

/* 오른쪽 비교 */
#right h3{font:600 11px/1 var(--mono);letter-spacing:.12em;color:var(--sub);margin:22px 0 10px;text-transform:uppercase}
#right h3:first-child{margin-top:0}
.grid16{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cell{border:1px solid var(--line);padding:6px 4px;text-align:center;font-size:12px;cursor:default;line-height:1.25}
.cell small{display:block;font:10px var(--mono);color:var(--sub)}
.cell.same{background:var(--acc);color:#fff;border-color:var(--acc)}
.cell.same small{color:#dfe3ff}
.cell.like{background:var(--acc-soft);border-color:var(--acc)}
.cell.rel{border:1px dotted var(--acc);color:var(--acc)}
.cell.near{border:1px dotted var(--warn);color:var(--warn)}
.cell.none{color:var(--sub);border-style:dashed}
.cell.click{cursor:pointer}
.legend{display:flex;gap:12px;font-size:11px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border:1px solid var(--acc)}
.verdict{font-size:15px;line-height:1.55;border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:14px 0 4px}
.ai{background:var(--paper);border:1px solid var(--line);padding:12px 14px;font-size:13.5px}
.ai p{margin:0 0 6px}
.ai p.h{font:600 11.5px/1.4 var(--sans);color:var(--acc);margin:12px 0 2px}
.ai ul{margin:6px 0 0;padding-left:18px}
.tag.ai-t{color:var(--acc);margin-left:4px}
.ai li{margin:3px 0}
.ai .src{font:11px var(--mono);color:var(--sub);margin-top:8px}
.kv{width:100%;border-collapse:collapse;font-size:12.5px}
.kv td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.kv td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
.kv tr.hit td:first-child::before{content:"● ";color:var(--warn)}
.peer{border-top:1px solid var(--line);padding:7px 0;display:grid;grid-template-columns:44px 1fr auto;gap:8px;font-size:12.5px;align-items:baseline}
.peer b{font-weight:600}
.peer .s{font:11px var(--mono);color:var(--sub)}
.peer button{font-size:11px;padding:0 6px}
.note{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.5}

/* 없는 조례 탭 */
#missing{display:none;grid-column:1/-1;overflow:auto}
.miss-head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.miss-head p{margin:0;color:var(--sub);max-width:640px}
.mrow{border-top:1px solid var(--line);display:grid;grid-template-columns:56px 1fr 120px;gap:12px;padding:10px 4px;cursor:pointer}
.mrow:hover{background:var(--paper)}
.mrow .big{font:500 20px/1 var(--mono);color:var(--warn)}
.mrow .big small{font-size:11px;color:var(--sub)}
.mrow .nm{font-weight:500}
.mrow .rg{font-size:12px;color:var(--sub)}
.mrow .fd{font:11px var(--mono);color:var(--sub);text-align:right}
.mdetail{grid-column:1/-1;padding:4px 0 8px 68px;font-size:12.5px}
.mdetail div{padding:2px 0}

body.missing-mode main>section:not(#missing){display:none}
body.missing-mode #missing{display:block}

footer{border-top:1px solid var(--line);padding:8px 20px;font-size:11px;color:var(--sub);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.visitors{display:flex;align-items:center;gap:8px;margin-left:auto}
.visitors img{display:block;height:20px}

@media (max-width:1100px){
  main{grid-template-columns:300px 1fr}
  #right{grid-column:1/-1;border-top:1px solid var(--ink)}
  main{overflow:auto;display:block}
  main>section{overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  #list{max-height:50vh}
}
@media (max-width:600px){
  header{padding:12px 16px}
  header .stat{margin-left:0;gap:14px}
  .pad{padding:14px 16px}
  .grid16{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="kick">READING SEJONG · ORDINANCE</div>
    <h1>세종 조례, <b>다른 시도와 나란히</b></h1>
  </div>
  <div class="stat">
    <div><b id="sN">–</b>세종 조례</div>
    <div><b id="sR">–</b>비교 광역</div>
    <div><b id="sM">–</b>세종에 없는 조례</div>
  </div>
</header>
<nav class="tabs">
  <button class="on" data-tab="search">조례 찾아 비교하기</button>
  <button data-tab="missing">다른 시도엔 있고 세종엔 없는 조례</button>
</nav>
<main>
  <section id="left">
    <div class="search">
      <input id="q" type="search" placeholder="조례 이름이나 키워드 (예: 교통, 주민자치, 건축)" autocomplete="off">
      <div class="chips" id="fields"></div>
      <div class="sortrow"><span id="cnt"></span>
        <select id="sort">
          <option value="date">최근 공포순</option>
          <option value="peers">비슷한 조례 많은 순</option>
          <option value="rare">세종에만 있는 순</option>
          <option value="title">가나다순</option>
        </select>
      </div>
    </div>
    <div id="list"></div>
  </section>
  <section id="mid"><div class="empty">왼쪽에서 조례를 고르면 본문이 여기 나옵니다.</div></section>
  <section id="right" class="pad"><div class="empty" style="padding:40px 10px">다른 광역자치단체의 같은·비슷한 조례와<br>세종 조례의 차이를 여기서 보여 줍니다.</div></section>
  <section id="missing" class="pad"></section>
</main>
<footer>
  <span>자료: 국가법령정보센터 자치법규 Open API · 광역 본청 조례만 비교(시·군·구 제외)</span>
  <span id="asof"></span>
  <span>'비슷한 조례'는 제목 유사도로 찾은 것이라 이름이 다른 같은 성격 조례는 놓칠 수 있습니다.</span>
  <span class="visitors"><img class="hitsbadge" src="https://hits.sh/ysong86.github.io/sejong_ordin.svg?view=today-total&amp;style=flat-square&amp;label=%EC%A1%B0%ED%9A%8C%EC%88%98&amp;color=1d5c7c&amp;labelColor=64748b" alt="조회수 오늘/전체" height="20" decoding="async"><span>오늘 / 전체</span></span>
</footer>

<script>
const $ = s => document.querySelector(s);
/* 조회수 배지 — 집계 서버가 막히면 깨진 그림 대신 접는다 */
$(".hitsbadge").addEventListener("error", e => { e.target.parentElement.style.display = "none"; });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD = d => d ? `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}` : "";
const lawUrl = mst => `https://www.law.go.kr/ordinInfoP.do?ordinSeq=${mst}`;
const SAME = 0.85;
let D, REG, OTHERS, AI = new Set(), cur = null, field = "전체", bodyCache = {};

const body = mst => bodyCache[mst] ??= fetch(`data/body/${mst}.json`).then(r => r.ok ? r.json() : null).catch(() => null);
const summary = id => !AI.has(id) ? Promise.resolve(null) : fetch(`data/summary/${id}.json`).then(r => r.ok ? r.json() : null).catch(() => null);

// 조 제목 비교용: 띄어쓰기·조사·괄호 정리 후 두 글자 묶음
const tnorm = t => (t || "").replace(/[\s·ㆍ()（）\[\]]/g, "").replace(/(등|및)/g, "");
const bigr = t => { const s = new Set(); for (let i = 0; i < t.length - 1; i++) s.add(t.slice(i, i + 2)); return s; };
const jac = (a, b) => { if (!a.size || !b.size) return 0; let n = 0; a.forEach(x => b.has(x) && n++); return n / (a.size + b.size - n); };
const GENERIC = /^(목적|정의|적용범위|다른법령과의관계|시행규칙|시행세칙|위임|위탁|규칙|준용|벌칙|과태료|시행일)$/;

fetch("data/ordin.json").then(r => r.json()).then(d => {
  D = d; REG = d.regions; OTHERS = Object.keys(REG).filter(k => k !== "세종"); AI = new Set(d.ai || []);
  $("#sN").textContent = d.sejong.length;
  $("#sR").textContent = OTHERS.length;
  $("#sM").textContent = d.missing.length;
  if (d.asof) $("#asof").textContent = `기준일 ${fmtD(d.asof)}`;
  const fc = {}; d.sejong.forEach(r => fc[r.field] = (fc[r.field] || 0) + 1);
  const fl = ["전체", ...Object.keys(fc).sort((a, b) => fc[b] - fc[a])];
  $("#fields").innerHTML = fl.map(f => `<button data-f="${esc(f)}" class="${f === field ? "on" : ""}">${esc(f)}${f === "전체" ? "" : ` <span class="mono">${fc[f]}</span>`}</button>`).join("");
  const q0 = new URLSearchParams(location.search).get("q");
  if (q0) $("#q").value = q0;
  renderList(); renderMissing();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "missing") setTab("missing");
  else if (h) { const r = D.sejong.find(x => x.id === h); if (r) open(r); }
});

$("#fields").onclick = e => { const b = e.target.closest("button"); if (!b) return; field = b.dataset.f;
  $("#fields").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderList(); };
$("#q").oninput = () => renderList();
$("#sort").onchange = () => renderList();
document.querySelector(".tabs").onclick = e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); };

function setTab(t) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.body.classList.toggle("missing-mode", t === "missing");
  if (t === "missing") history.replaceState(null, "", "#missing");
  else history.replaceState(null, "", cur ? "#" + cur.id : location.pathname);
}

function hl(t, q) {
  if (!q) return esc(t);
  const words = q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return esc(t).replace(new RegExp(`(${words.join("|")})`, "g"), "<mark>$1</mark>");
}

function renderList() {
  const q = $("#q").value.trim();
  const words = q.split(/\s+/).filter(Boolean);
  let rows = D.sejong.filter(r => (field === "전체" || r.field === field) && words.every(w => r.title.includes(w)));
  const s = $("#sort").value;
  rows.sort(s === "peers" ? (a, b) => b.peers.length - a.peers.length
          : s === "rare" ? (a, b) => a.peers.length - b.peers.length || b.date.localeCompare(a.date)
          : s === "title" ? (a, b) => a.title.localeCompare(b.title, "ko")
          : (a, b) => b.date.localeCompare(a.date));
  $("#cnt").textContent = `${rows.length}건`;
  $("#list").innerHTML = rows.map(r => `<div class="item ${cur && cur.id === r.id ? "on" : ""}" data-id="${r.id}">
    <div class="t">${hl(r.title.replace("세종특별자치시 ", ""), q)}</div>
    <div class="m">${esc(r.field)} · ${fmtD(r.date)} ${esc(r.kind)}${AI.has(r.id) ? `<span class="tag ai-t">AI 요약</span>` : ""}</div>
    <div class="n ${r.peers.length ? "" : "zero"}">${r.peers.length}<small>/${OTHERS.length} 시도</small></div>
  </div>`).join("") || `<div class="empty">찾는 조례가 없습니다.<br>'다른 시도엔 있고 세종엔 없는 조례' 탭에서 찾아보세요.</div>`;
}
$("#list").onclick = e => { const it = e.target.closest(".item"); if (it) open(D.sejong.find(r => r.id === it.dataset.id)); };

async function open(r) {
  cur = r;
  document.querySelectorAll(".item").forEach(x => x.classList.toggle("on", x.dataset.id === r.id));
  history.replaceState(null, "", "#" + r.id);
  $("#mid").innerHTML = `<div class="pad doc"><h2>${esc(r.title)}</h2><div class="meta">불러오는 중…</div></div>`;
  $("#right").innerHTML = `<div class="empty" style="padding:30px 0">비교하는 중…</div>`;
  const [sb, peersB, ai] = await Promise.all([
    body(r.mst), Promise.all(r.peers.map(p => body(p.mst))), summary(r.id)]);
  if (cur !== r) return;
  const cmp = compareArts(sb, r.peers, peersB);
  renderDoc(r, sb, cmp);
  renderRight(r, sb, peersB, cmp, ai);
}

// 조 제목 기준 비교: 세종만 있는 조 / 다른 시도 다수가 두는데 세종엔 없는 조
function compareArts(sb, peers, peersB) {
  const mine = (sb?.arts || []).map(a => ({ t: a.t, g: bigr(tnorm(a.t)) }));
  const valid = peersB.map((b, i) => b && { r: peers[i].r, sim: peers[i].sim, arts: b.arts.map(a => ({ t: a.t, g: bigr(tnorm(a.t)) })) }).filter(Boolean);
  const match = (g, arts) => arts.some(a => jac(g, a.g) >= 0.5);
  const onlyMine = new Set(mine.filter(m => m.t && !GENERIC.test(tnorm(m.t)) && valid.length >= 2 && !valid.some(v => match(m.g, v.arts))).map(m => m.t));
  // 다른 시도 조 제목 묶기
  const pool = [];
  valid.forEach(v => v.arts.forEach(a => {
    if (GENERIC.test(tnorm(a.t)) || !a.t) return;
    let c = pool.find(p => jac(p.g, a.g) >= 0.5);
    if (!c) pool.push(c = { t: a.t, g: a.g, rs: new Set() });
    c.rs.add(v.r);
  }));
  const need = Math.max(2, Math.ceil(valid.length * 0.4));
  const lacking = pool.filter(p => p.rs.size >= need && !mine.some(m => jac(m.g, p.g) >= 0.5))
    .sort((a, b) => b.rs.size - a.rs.size).slice(0, 8);
  const nArts = valid.map(v => v.arts.length).sort((a, b) => a - b);
  const med = nArts.length ? nArts[Math.floor(nArts.length / 2)] : null;
  return { onlyMine, lacking, med, nPeer: valid.length, nMine: mine.length };
}

function renderDoc(r, sb, cmp, peerView) {
  if (!sb) { $("#mid").innerHTML = `<div class="pad doc"><h2>${esc(r.title)}</h2><p>본문을 불러오지 못했습니다. <a href="${lawUrl(r.mst)}" target="_blank" rel="noopener">국가법령정보센터에서 보기 ↗</a></p></div>`; return; }
  const v = peerView;
  const show = v ? v.b : sb;
  $("#mid").innerHTML = `<div class="pad doc">
    ${v ? `<div class="cmpbar">지금 <b>${esc(v.r)}</b> 조례를 보고 있습니다 <button id="back">세종 조례로 돌아가기</button></div>` : ""}
    <h2>${esc(show.title)}</h2>
    <div class="meta"><span>${esc(show.org)}</span><span>${fmtD(show.date)} 공포</span>${show.dept ? `<span>${esc(show.dept)}</span>` : ""}<span>${show.arts.length}개 조</span>
      <a href="${lawUrl(v ? v.mst : r.mst)}" target="_blank" rel="noopener">원문 ↗</a></div>
    ${show.arts.map(a => {
      const only = !v && cmp.onlyMine.has(a.t);
      return `<div class="art ${only ? "only" : ""}"><div class="at">${esc(a.t || "")}${only ? `<span class="tag acc">세종만</span>` : ""}</div><div class="ac">${esc(a.c.replace(/^제\d+조(의\d+)?\([^)]*\)\s*/, ""))}</div></div>`;
    }).join("")}
  </div>`;
  $("#mid").scrollTop = 0;
  const bk = $("#back"); if (bk) bk.onclick = () => renderDoc(r, sb, cmp);
}

const TIER = { same: "같음", like: "비슷", rel: "관련", near: "확인" };

function renderRight(r, sb, peersB, cmp, ai) {
  const byR = Object.fromEntries(r.peers.map((p, i) => [p.r, { ...p, b: peersB[i] }]));
  // '세종에 없는 조례' 묶음 중 이 조례가 가장 가까운 것 → 이름이 다른 비슷한 조례(확인 필요)
  const nears = D.missing.filter(m => m.near && m.near.id === r.id && m.near.sim >= 0.3);
  const nearR = {};
  nears.forEach(m => m.items.forEach(x => { if (!byR[x.r] && !nearR[x.r]) nearR[x.r] = x; }));
  const nSame = r.peers.filter(p => p.tier === "same").length, nAll = r.peers.length;
  const verdict = nAll === 0 ? `다른 광역자치단체에서 <b>비슷한 이름의 조례를 찾지 못했습니다</b>. 세종만의 조례일 가능성이 큽니다.`
    : nAll >= OTHERS.length * 0.7 ? `${OTHERS.length}개 시도 중 <b>${nAll}곳</b>이 같은·비슷한 조례를 두고 있습니다. 대부분 갖춘 보편적인 조례입니다.`
    : `${OTHERS.length}개 시도 중 <b>${nAll}곳</b>에 같은·비슷한 조례가 있습니다${nSame ? ` (거의 같은 이름 ${nSame}곳)` : ""}.`;
  const nNear = Object.keys(nearR).length;
  const verdict2 = nNear ? ` 이 밖에 <b>${nNear}곳</b>은 이름이 다른 비슷한 조례를 두고 있어 확인이 필요합니다.` : "";
  const lenNote = cmp.med && cmp.nMine ? (cmp.nMine >= cmp.med * 1.4 ? `조문이 ${cmp.nMine}개로 다른 시도(중간값 ${cmp.med}개)보다 자세한 편입니다.`
    : cmp.nMine <= cmp.med * 0.7 ? `조문이 ${cmp.nMine}개로 다른 시도(중간값 ${cmp.med}개)보다 간결한 편입니다.` : `조문 수(${cmp.nMine}개)는 다른 시도(중간값 ${cmp.med}개)와 비슷합니다.`) : "";

  $("#right").innerHTML = `
    <h3>광역자치단체 보유 현황</h3>
    <div class="grid16">${OTHERS.map(k => { const p = byR[k], nr = nearR[k];
      const c = p ? p.tier : nr ? "near" : "none";
      return `<div class="cell ${c} ${p ? "click" : ""}" data-r="${k}" title="${esc(p ? p.title : nr ? nr.title : "비슷한 조례 없음")}">${k}<small>${TIER[c] || "없음"}</small></div>`; }).join("")}</div>
    <div class="legend"><span><i style="background:var(--acc)"></i>같음</span><span><i style="background:var(--acc-soft)"></i>비슷</span><span><i style="border-style:dotted"></i>관련·확인 필요</span><span><i style="border-style:dashed;border-color:var(--line2)"></i>없음</span></div>
    <div class="verdict">${verdict}${verdict2}</div>

    <h3>세종 조례의 특징 요약</h3>
    ${ai ? `<div class="ai">${ai.html || ""}<div class="src">AI 요약 · ${esc(ai.model || "")} · ${esc(ai.date || "")} · 원문과 대조해 확인하세요</div></div>`
         : `<div class="ai">${autoSummary(r, cmp, lenNote)}<div class="src">조문 제목을 기계적으로 비교한 결과입니다 (AI 요약은 아직 이 조례에 없음)</div></div>`}

    ${cmp.lacking.length ? `<h3>다른 시도 다수가 두는데 세종엔 없는 조항</h3>
      <table class="kv">${cmp.lacking.map(p => `<tr class="hit"><td>${esc(p.t)}</td><td>${p.rs.size}/${cmp.nPeer}곳</td></tr>`).join("")}</table>` : ""}

    ${nAll ? `<h3>시도별 조례 (${nAll})</h3>
      ${r.peers.map(p => `<div class="peer"><b>${p.r}</b><span>${esc(p.title)} <span class="s">${TIER[p.tier]} ${Math.round(p.sim * 100)}%</span></span><span><button data-view="${p.r}">본문</button> <a href="${lawUrl(p.mst)}" target="_blank" rel="noopener">↗</a></span></div>`).join("")}` : ""}
    ${Object.keys(nearR).length ? `<h3>이름이 다른 비슷한 조례 · 확인 필요 (${Object.keys(nearR).length})</h3>
      ${Object.entries(nearR).map(([k, x]) => `<div class="peer"><b>${k}</b><span>${esc(x.title)}</span><span><a href="${lawUrl(x.mst)}" target="_blank" rel="noopener">↗</a></span></div>`).join("")}` : ""}
    <p class="note">%는 조례 이름의 유사도입니다. '관련'과 '확인 필요'는 이름의 핵심어가 겹치는 정도로 찾은 것이라 실제로는 다른 조례일 수 있습니다.</p>`;

  $("#right").onclick = e => {
    const t = e.target.closest("[data-view],.cell.click"); if (!t) return;
    const p = byR[t.dataset.view || t.dataset.r];
    if (p && p.b) renderDoc(r, sb, cmp, { r: p.r, mst: p.mst, b: p.b });
  };
}

function autoSummary(r, cmp, lenNote) {
  const li = [];
  if (lenNote) li.push(lenNote);
  if (cmp.onlyMine.size) li.push(`다른 시도 조례에 없는 세종만의 조항: ${[...cmp.onlyMine].slice(0, 6).map(t => `<b>${esc(t)}</b>`).join(", ")}`);
  if (cmp.lacking.length) li.push(`다른 시도 다수가 두지만 세종엔 없는 조항: ${cmp.lacking.slice(0, 4).map(p => `<b>${esc(p.t)}</b>(${p.rs.size}곳)`).join(", ")}`);
  if (!r.peers.length) li.push("비교할 다른 시도 조례가 없어 조항 비교를 하지 않았습니다.");
  else if (!cmp.onlyMine.size && !cmp.lacking.length) li.push("조항 구성이 다른 시도와 거의 같습니다. 차이는 세부 문구(대상·금액·기준)에 있을 수 있습니다.");
  return `<ul>${li.map(x => `<li>${x}</li>`).join("")}</ul>`;
}

function renderMissing() {
  const fc = {}; D.missing.forEach(m => fc[m.field] = (fc[m.field] || 0) + 1);
  let mf = "전체";
  const draw = () => {
    const rows = D.missing.filter(m => mf === "전체" || m.field === mf);
    $("#missing").innerHTML = `
      <div class="miss-head"><div><h2 style="margin:0 0 6px;font-size:21px">다른 시도엔 있고 세종엔 없는 조례 <span class="mono" style="color:var(--warn)">${rows.length}</span></h2>
      <p>${OTHERS.length}개 광역자치단체 중 4곳 이상이 두고 있지만, 세종에서는 이름이 비슷한 조례를 찾지 못한 것들입니다. 세종이 다른 이름의 조례나 상위 조례 안에 같은 내용을 담고 있을 수 있으니 검토 출발점으로 봐 주세요.</p></div></div>
      <div class="chips" style="margin-bottom:12px">${["전체", ...Object.keys(fc).sort((a, b) => fc[b] - fc[a])].map(f => `<button data-f="${esc(f)}" class="${f === mf ? "on" : ""}">${esc(f)}${f === "전체" ? "" : ` <span class="mono">${fc[f]}</span>`}</button>`).join("")}</div>
      ${rows.map((m, i) => `<div class="mrow" data-i="${D.missing.indexOf(m)}">
        <div class="big">${m.n}<small>/${OTHERS.length}</small></div>
        <div><div class="nm">${esc(m.items[0].title.replace(/^(\S+(특별시|광역시|특별자치도|특별자치시|도|통합특별시))\s/, ""))}</div><div class="rg">${m.items.map(x => x.r).join(" · ")}</div>
          ${m.near && m.near.sim >= 0.3 ? `<div class="rg">확인 필요: 세종의 <a href="#${m.near.id}" data-open="${m.near.id}">${esc(m.near.title.replace("세종특별자치시 ", ""))}</a>에 담겼을 수 있음</div>` : ""}</div>
        <div class="fd">${esc(m.field)}</div></div>`).join("")}`;
  };
  draw();
  $("#missing").onclick = e => {
    const b = e.target.closest(".chips button"); if (b) { mf = b.dataset.f; draw(); return; }
    const o = e.target.closest("[data-open]");
    if (o) { e.preventDefault(); setTab("search"); open(D.sejong.find(r => r.id === o.dataset.open)); return; }
    const row = e.target.closest(".mrow"); if (!row) return;
    const nx = row.nextElementSibling;
    if (nx && nx.classList.contains("mdetail")) { nx.remove(); return; }
    const m = D.missing[row.dataset.i];
    row.insertAdjacentHTML("afterend", `<div class="mdetail">${m.items.map(x => `<div><b>${x.r}</b> ${esc(x.title)} <span class="mono" style="color:var(--sub)">${fmtD(x.date)}</span> <a href="${lawUrl(x.mst)}" target="_blank" rel="noopener">원문 ↗</a></div>`).join("")}</div>`);
  };
}
</script>
</body>
